# GCP の VM で動かす構成（docs/deploy-gcp.md）。Caddy が https の証明書を自動で取り、アプリへ渡す
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: ./app-settings
    volumes:
      - resemen-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RESEMEN_DOMAIN=${RESEMEN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  resemen-data:
  caddy-data:
  caddy-config:
