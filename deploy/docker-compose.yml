# GCP の VM で動かす構成（docs/deploy-gcp.md）。起動は deploy/start.sh から。Caddy が https の証明書を自動で取り、アプリへ渡す
services:
  app:
    build: ..
    restart: unless-stopped
    # API キーは deploy/start.sh が Secret Manager から読み出して渡す（ファイルに書かない）
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?start.sh から起動してください}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      # Caddy の後ろで動く（アプリの口は外に出していない）ので、Caddy が付ける X-Real-IP を接続元として信用する
      - RESEMEN_TRUST_PROXY=1
      # 画面を開く Origin（https://ドメイン）。GET 以外の API は、この Origin か同じ Host からだけ受ける
      - RESEMEN_ALLOWED_ORIGINS=https://${RESEMEN_DOMAIN}
      # 招待なしの登録を許すときだけ 1 にする（既定は閉じる）
      - RESEMEN_OPEN_SIGNUP=${RESEMEN_OPEN_SIGNUP:-}
      # 外部につなぐコネクタ（docs/connectors.md）。既定は空＝無効。有効にするときだけ、id と接続を許す host:port を書く。
      # 接続先と認証情報（RESEMEN_CONNECT_<ID>_URL など）は、まだここから渡していない。有効にするときに、
      # API キーと同じく Secret Manager から読み出して渡す行を足す（値をファイルに書かない）
      - RESEMEN_CONNECTORS=${RESEMEN_CONNECTORS:-}
      - RESEMEN_CONNECT_ALLOW=${RESEMEN_CONNECT_ALLOW:-}
    volumes:
      - resemen-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RESEMEN_DOMAIN=${RESEMEN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
volumes:
  resemen-data:
  caddy-data:
  caddy-config:
